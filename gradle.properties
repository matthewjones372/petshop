# The lark every module builds against. `-PlarkVersion=0.9.1-SNAPSHOT` overrides it, and a snapshot is
# looked for in ~/.m2 too, which is how a lark change is tried here before it is released.
larkVersion=0.9.0

# The pelican every module builds against, the same way: `-PpelicanVersion=…-SNAPSHOT` tries one
# before it is released, from Central's snapshot repository or ~/.m2.
pelicanVersion=1.0.0

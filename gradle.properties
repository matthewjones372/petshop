# The lark every module builds against. `-PlarkVersion=0.9.1-SNAPSHOT` overrides it, and a snapshot is
# looked for in ~/.m2 too, which is how a lark change is tried here before it is released.
larkVersion=0.9.2

# The pelican every module builds against, on the same terms: a snapshot is looked for in ~/.m2. 1.0.0 is the first
# release with pelican-health, which the shop's /health/live and /health/ready are built from.
pelicanVersion=1.0.0

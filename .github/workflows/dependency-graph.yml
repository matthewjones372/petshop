name: dependency-graph

# Hands GitHub the resolved Gradle graph, so Dependabot alerts cover the libraries the shop actually runs on.
# GitHub's own scan cannot read build.gradle.kts, so without this the graph is empty. outbox-table is an
# included build, and the submission resolves it with the rest.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/dependency-submission@v6

name: build

# Load tests are not part of `build`: they measure the machine and need a quiet one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: namespace-profile-mattjones372
    steps:
      - uses: actions/checkout@v7

      # 21 for outbox-table's toolchain; 25, listed last, is the shop's and the one Gradle runs on.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --stacktrace koverXmlReport
      - name: Keep the test and coverage reports for Gauntlet
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gauntlet-reports"
          find . \( -path '*/build/test-results/*.xml' -o -path '*/build/reports/kover/*.xml' -o -path '*/build/reports/jacoco/*.xml' -o -path '*/target/test-reports/*.xml' -o -path '*/coverage-report/cobertura.xml' \) -not -path './.git/*' | while read -r f; do mkdir -p "$RUNNER_TEMP/gauntlet-reports/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/gauntlet-reports/$f"; done
      - name: Upload the reports for Gauntlet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-reports-build
          path: ${{ runner.temp }}/gauntlet-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

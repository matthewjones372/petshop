services:
  registry:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./registry/mappings:/home/wiremock/mappings:ro
    ports:
      - "8089:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petshop
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop
    ports:
      # 55432 on the host, since a local Postgres usually holds 5432.
      - "55432:5432"

  # The JVM image: kafka-native segfaults on some starts.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    depends_on: [postgres]
    environment:
      DATA_SOURCE_URI: postgres:5432/petshop?sslmode=disable
      DATA_SOURCE_USER: petshop
      DATA_SOURCE_PASS: petshop

  # --kafka.version: Kafka 4 dropped the protocol versions the exporter asks for by default.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:29092", "--kafka.version=3.9.0"]
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  traffic:
    build:
      context: ..
      dockerfile: demo/traffic/Dockerfile
    environment:
      PETSHOP_URL: http://host.docker.internal:8080
      RATE: "5"
      # A day a run, then restarted: Proofload keeps a run in a fixed number of slots, so a day holds about 7 MiB.
      DURATION: 24h
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # The front end in web/, built and served at http://localhost:5173; WEB_PORT moves it, say while `bun run dev` holds 5173.
  web:
    build:
      context: ..
      dockerfile: demo/web/Dockerfile
    environment:
      PETSHOP_URL: http://host.docker.internal:8080
      TEMPO_URL: http://tempo:4318
      LOKI_URL: http://loki:3100
      PROMETHEUS_URL: http://prometheus:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-5173}:5173"

  # Headless Chromium visiting the front end, so petshop-web has numbers with nobody at the keyboard. RATE is visits a minute.
  browser:
    build:
      context: ..
      dockerfile: demo/browser/Dockerfile
    depends_on: [web]
    environment:
      WEB_URL: http://web:5173
      RATE: "4"
    restart: unless-stopped

  # Receives the shop's lines when it runs with LOKI_URL=http://localhost:3100.
  loki:
    image: grafana/loki:3.6.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
      # Tempo's span metrics arrive by remote write, and the front end's own metrics over OTLP.
      - --web.enable-remote-write-receiver
      - --enable-feature=otlp-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    # Linux has no host.docker.internal of its own; Docker Desktop ignores this.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [prometheus, loki, tempo]
    environment:
      # A demo nobody logs into. Do not copy this into anything that matters.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/petshop.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  estate:
    image: ghcr.io/matthewjones372/estate:main
    depends_on: [prometheus, alertmanager]
    volumes:
      - ./estate:/etc/estate:ro
    ports:
      - "8095:8080"


# Monitoring and dependencies for a petshop running on the host with `./gradlew :app:run`.
services:
  # WireMock standing in for the chip registry. application.conf points at it by default.
  registry:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./registry/mappings:/home/wiremock/mappings:ro
    ports:
      - "8089:8080"

  # The outbox's database. The petshop creates the table itself on start.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petshop
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop
    ports:
      # 55432 on the host, since a local Postgres usually holds 5432.
      - "55432:5432"

  # For BUS=kafka. The host reaches it on 9092, the schema registry on kafka:29092. The JVM image:
  # kafka-native segfaults on some starts.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  # Estate's postgres store reads these metrics.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    depends_on: [postgres]
    environment:
      DATA_SOURCE_URI: postgres:5432/petshop?sslmode=disable
      DATA_SOURCE_USER: petshop
      DATA_SOURCE_PASS: petshop

  # Estate's kafka store reads these. The broker speaks Kafka 4, which dropped the protocol versions the
  # exporter asks for unless it is told which version it is talking to.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    depends_on: [kafka]
    command: ["--kafka.server=kafka:29092", "--kafka.version=3.9.0"]
    restart: unless-stopped

  # application.conf points at it when BUS=kafka.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  # Demo visitors. Restarted when it ends or the shop is not up yet. `docker compose stop traffic` for a
  # quiet shop.
  traffic:
    build:
      context: ..
      dockerfile: demo/traffic/Dockerfile
    environment:
      PETSHOP_URL: http://host.docker.internal:8080
      RATE: "5"
      DURATION: 24h
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Receives the shop's lines when it runs with LOKI_URL=http://localhost:3100.
  loki:
    image: grafana/loki:3.6.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    # Linux has no host.docker.internal of its own; Docker Desktop ignores this.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [prometheus]
    environment:
      # A demo nobody logs into. Do not copy this into anything that matters.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/petshop.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # Sends alerts nowhere: Estate reads them and keeps its silences here.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # Estate, on http://localhost:8095. Its catalog is estate/catalog.yaml.
  estate:
    image: ghcr.io/matthewjones372/estate:main
    depends_on: [prometheus, alertmanager]
    volumes:
      - ./estate:/etc/estate:ro
    ports:
      - "8095:8080"


# Prometheus and Grafana, pointed at a petshop running on the host, a stand-in
# for the chip registry the petshop calls out to, the Postgres its outbox is in,
# and the Kafka broker and schema registry its events go to when BUS=kafka.
#
# The application is not in here on purpose: it is the thing being demonstrated,
# and running it with `./gradlew :app:run` is how a reader would run it anyway.
services:
  # The chip registry is somebody else's service; this is WireMock answering in its place, from
  # the same kind of stub the tests use. application.conf points at it by default.
  registry:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./registry/mappings:/home/wiremock/mappings:ro
    ports:
      - "8089:8080"

  # Where the outbox table lives. The petshop creates the table itself on start.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petshop
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop
    ports:
      # 55432 on the host rather than 5432, which a Postgres installed on the machine is usually
      # already holding. application.conf points at this one.
      - "55432:5432"

  # The bus, for BUS=kafka: one KRaft node, so there is no ZooKeeper beside it. The shop on the host
  # reaches it on 9092; the schema registry, in here, on kafka:29092.
  kafka:
    image: apache/kafka-native:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  # Postgres as Prometheus sees it: whether it answers (pg_up), its connections, transactions and size, and
  # each table's live rows, which is how many events wait in the outbox. Estate's postgres store reads these.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    depends_on: [postgres]
    environment:
      DATA_SOURCE_URI: postgres:5432/petshop?sslmode=disable
      DATA_SOURCE_USER: petshop
      DATA_SOURCE_PASS: petshop

  # Kafka as Prometheus sees it: each partition's offsets and the projection's consumer lag. Estate's kafka
  # store reads these. The broker speaks Kafka 4, which dropped the protocol versions the exporter asks for
  # unless it is told which version it is talking to.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    depends_on: [kafka]
    command: ["--kafka.server=kafka:29092", "--kafka.version=3.9.0"]
    restart: unless-stopped

  # Where the events' Avro schema is registered. application.conf points at it when BUS=kafka.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  # Where the shop's lines go when it runs with LOKI_URL=http://localhost:3100, and where Estate reads them.
  loki:
    image: grafana/loki:3.6.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Five seconds of history is nothing; the demo is watched, not kept.
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    # Linux has no host.docker.internal of its own; Docker Desktop ignores this.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [prometheus]
    environment:
      # A demo nobody logs into. Do not copy this into anything that matters.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/petshop.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # Where the rules in prometheus/rules.yml fire. It sends them nowhere: Estate reads them from here, and the silences
  # written on Estate's page are kept here.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # Estate: is the petshop well, and if not, where to look. Its catalog is estate/catalog.yaml; it reads the
  # Prometheus and Alertmanager above. http://localhost:8095
  estate:
    image: ghcr.io/matthewjones372/estate:main
    depends_on: [prometheus, alertmanager]
    volumes:
      - ./estate:/etc/estate:ro
    ports:
      - "8095:8080"


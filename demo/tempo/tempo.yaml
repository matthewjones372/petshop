# Receives the shop's spans over OTLP when it runs with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Span metrics and the service graph, written to Prometheus, are how Estate sees the front end's calls and errors.
metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]

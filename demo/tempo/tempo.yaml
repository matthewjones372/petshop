# Receives the shop's spans over OTLP when it runs with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

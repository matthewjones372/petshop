apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: petshop-prometheus

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: petshop-tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: petshop-loki
        filterByTraceID: true

  # A line's trace_id, from the adopt span, links to that trace in Tempo.
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: petshop-loki
    jsonData:
      derivedFields:
        - name: trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: petshop-tempo
          url: "$${__value.raw}"

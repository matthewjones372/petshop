# Every two seconds, because the arrivals stream ticks every five and a demo
# that waits fifteen for its first point looks broken.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: petshop
    metrics_path: /metrics
    static_configs:
      # The app runs on the host, not in this compose file.
      - targets: ["host.docker.internal:8080"]

# Every two seconds: arrivals tick every five, and a fifteen second wait for a first point looks broken.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: petshop
    metrics_path: /metrics
    static_configs:
      # On Linux this is the Docker bridge, so the app must listen on it: HOST=0.0.0.0 ./gradlew :app:run.
      - targets: ["host.docker.internal:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

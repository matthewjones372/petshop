environments:
  - name: demo
    title: The demo, on this machine
    sources: demo

services:
  - name: petshop
    category: Shop
    description: Adopt a pet. The HTTP API, the shop's actor, its outbox in Postgres and the relay to the bus
    repository: github:matthewjones372/petshop
    runbook: https://github.com/matthewjones372/petshop/blob/main/demo/README.md
    environments: [ demo ]
    # A declared refusal is an answer, not an error. No p99: the adoption timer is a summary without percentiles.
    load:
      requests: sum(rate(petshop_adoptions_total[1m]))
      errors: sum(rate(petshop_adoptions_total{outcome=~"registry_down|not_recorded"}[1m])) or vector(0)
    links:
      # The front end in web/, served by compose's `web` service, or by `bun run --cwd web dev`.
      app: http://localhost:5173
      api: http://localhost:8080/api-docs
      health: http://localhost:8080/health/ready
      metrics: http://localhost:8080/metrics
      dashboard: http://localhost:3000
      prometheus: http://localhost:9090/alerts
    logs: { selector: '{app="petshop"}', errors: ERROR }
    stats:
      preset: jvm
      selector: job="petshop"
      extra:
        - { title: Pets in the shop, query: max(petshop_pets_in_shop) }
        - { title: Mean adoption, query: '1000 * sum(petshop_adopt_duration_sum) / clamp_min(sum(petshop_adopt_duration_count), 1)', unit: ms }
        - { title: Events published, query: 'sum(rate(petshop_outbox_published_total[1m]))', unit: /s }
        - { title: Claimed per tick, query: max(petshop_outbox_claimed) }
        - { title: Refused by the bus, query: 'sum(rate(petshop_outbox_refused_total[1m])) or vector(0)', unit: /s }
        - { title: Connections in use, query: 'max(hikaricp_connections_active{pool="petshop"})' }
        - { title: Waiting for a connection, query: 'max(hikaricp_connections_pending{pool="petshop"})' }
        - { title: Health checks failing, query: 'count(petshop_health_check == 0) or vector(0)' }

  # Its numbers are Tempo's span metrics for the browser's spans, and Effect's OTLP metrics and lines from web/.
  - name: petshop-web
    category: Shop
    description: The front end in web/. Each call to the shop is a span in the browser, and the shop continues its trace
    repository: github:matthewjones372/petshop
    runbook: https://github.com/matthewjones372/petshop/blob/main/README.md
    environments: [ demo ]
    load:
      requests: 'sum(rate(traces_spanmetrics_calls_total{service="petshop-web", span_kind="SPAN_KIND_CLIENT"}[1m]))'
      errors: 'sum(rate(traces_spanmetrics_calls_total{service="petshop-web", span_kind="SPAN_KIND_CLIENT", status_code="STATUS_CODE_ERROR"}[1m])) or vector(0)'
      p99: 'histogram_quantile(0.99, sum by (le) (rate(traces_spanmetrics_latency_bucket{service="petshop-web", span_kind="SPAN_KIND_CLIENT"}[5m])))'
    links:
      app: http://localhost:5173
      # Grafana's Explore on Tempo, searching for the browser's spans.
      traces: http://localhost:3000/explore?schemaVersion=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22petshop-tempo%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22tempo%22%2C%22uid%22%3A%22petshop-tempo%22%7D%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bresource.service.name%3D%5C%22petshop-web%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D
    # Loki keeps an OTLP line's level as metadata, so the line is prefixed with it for Estate to read.
    logs: { selector: '{service_name="petshop-web"} | line_format "{{.severity_text}} {{__line__}}"', errors: ERROR }
    stats:
      extra:
        - { title: Adoption click to answer, query: '1000 * sum(rate(traces_spanmetrics_latency_sum{service="petshop-web", span_name="adopt pet"}[5m])) / clamp_min(sum(rate(traces_spanmetrics_latency_count{service="petshop-web", span_name="adopt pet"}[5m])), 1e-9)', unit: ms }
        - { title: /live reconnects, query: 'sum(rate(traces_spanmetrics_calls_total{service="petshop-web", span_name="live connection", status_code="STATUS_CODE_ERROR"}[5m])) or vector(0)', unit: /s }
        - { title: Uncaught errors, query: 'sum(rate(traces_spanmetrics_calls_total{service="petshop-web", span_name=~"uncaught error|unhandled rejection"}[5m])) or vector(0)', unit: /s }
        - { title: Largest Contentful Paint, query: 'max(web_vital_milliseconds{name="LCP"})', unit: ms }
        - { title: Interaction to Next Paint, query: 'max(web_vital_milliseconds{name="INP"})', unit: ms }
        - { title: Cumulative Layout Shift, query: 'max(web_vital_ratio{name="CLS"})' }

# An alert carrying `store: <name>` is shown on that store.
stores:
  - name: outbox-db
    category: Shop
    description: The catalogue and the outbox, written together in one transaction
    environments: [ demo ]
    engine: postgres
    selector: job="postgres"
    extra:
      # Postgres's own estimate, from its table statistics: the events written and not yet relayed.
      - { title: Events in the outbox, query: 'max(pg_stat_user_tables_n_live_tup{relname="outbox"})' }
      - { title: Pets on record, query: 'max(pg_stat_user_tables_n_live_tup{relname="pets"})' }
  - name: events
    category: Shop
    description: The shop's events, as Avro in the schema registry's wire format, when the shop runs with BUS=kafka
    environments: [ demo ]
    engine: kafka
    selector: job="kafka"
    links: { schemas: http://localhost:8081/subjects }
    # Estate's default calls any lag growth a concern; this tolerates one event per ten seconds.
    attention: { growing: 0.1 }
    extra:
      - { title: Events on the topic, query: 'sum(kafka_topic_partition_current_offset{topic="petshop.events"})' }
      - { title: Projection lag, query: 'sum(kafka_consumergroup_lag{consumergroup="petshop-projection"}) or vector(0)' }

alerts:
  ChipRegistryUnreachable: { impact: "Adopters are told to try again later, and the pet stays on the shelf." }
  AdoptionsNotRecorded: { impact: "Every adoption is refused with a 503 until the database answers again." }
  PetshopNotReady: { impact: "The shop says it cannot serve; /health/ready lists what is failing." }
  PostgresDown: { impact: "Every adoption is refused with a 503, arrivals stop, and no events reach the bus." }
  KafkaDown: { impact: "Events stay in the outbox, and /stats stops moving, until the broker is back." }
  BrowserCallsFailing: { impact: "People in the browser see pets fail to load, or adoptions answered with an error." }

vitals:
  - title: Adoptions
    query: sum(rate(petshop_adoptions_total{outcome="taken"}[5m])) or vector(0)
    unit: /s
  - title: Refused
    query: 100 * sum(rate(petshop_adoptions_total{outcome!="taken"}[5m])) / clamp_min(sum(rate(petshop_adoptions_total[5m])), 0.0001)
    unit: "%"
  - title: Arrivals
    query: sum(rate(petshop_arrivals_total[5m]))
    unit: /s

map:
  nodes:
    - { id: web, service: petshop-web }
    - { id: petshop, service: petshop }
    - { id: registry, title: Chip registry, kind: external }
    - { id: postgres, title: Postgres, store: outbox-db }
    - { id: bus, title: Kafka, store: events }
  edges:
    # Tempo's service graph: calls whose client span is the browser's and whose server span is the shop's.
    - { from: web, to: petshop, label: calls, rate: 'sum(rate(traces_service_graph_request_total{client="petshop-web", server="petshop"}[1m]))', alert: BrowserCallsFailing }
    - { from: petshop, to: registry, label: chips, rate: 'sum(rate(petshop_adoptions_total{outcome=~"taken|not_chipped|registry_down"}[1m]))', alert: ChipRegistryUnreachable }
    # Estate draws an edge with no rate as dead, so this one carries the database's transaction rate.
    - { from: petshop, to: postgres, label: records, rate: 'sum(rate(pg_stat_database_xact_commit{datname="petshop"}[1m]))', alert: PostgresDown }
    - { from: postgres, to: bus, label: relays, rate: 'sum(rate(petshop_outbox_published_total[1m]))', alert: BusRefusingEvents }
    # Drawn from the shop to the bus: an edge back to the shop would form a loop, which Estate's column layout
    # pushes off the canvas.
    - { from: petshop, to: bus, label: reads back, rate: 'sum(rate(kafka_consumergroup_current_offset_sum{consumergroup="petshop-projection"}[1m]))', alert: ProjectionFallingBehind }

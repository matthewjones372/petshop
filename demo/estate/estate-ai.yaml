# The demo's Estate settings with Ask AI turned on: estate.yaml, and a model to ask. Read in place of estate.yaml when
# Compose is started with docker-compose.ai.yml, which also passes ANTHROPIC_API_KEY through; estate.yaml itself
# names no key, so the demo starts without one. Keep the two in step.
port: 8080
catalog: /etc/estate/catalog.yaml

auth:
  # Demo only: a public session secret, and every visitor an operator.
  sessionSecret: the-petshop-demo-runs-on-a-laptop-only
  roles:
    viewer: [ developers ]
    operator: [ ops ]
  anonymous: { name: visitor, role: operator }

sources:
  demo:
    prometheus: { url: http://prometheus:9090 }
    alertmanager: { url: http://alertmanager:9093 }
    loki: { url: http://loki:3100 }

# Haiku is the cheapest Claude and good enough for "why is this firing"; the budget caps a day's spend.
ai: { provider: anthropic, apiKey: "${ANTHROPIC_API_KEY}", model: claude-haiku-5-5, budget: { tokensPerDay: 150000 } }

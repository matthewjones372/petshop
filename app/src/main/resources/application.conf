petshop {
  # Loopback so the demo is not served to the network. HOST=0.0.0.0 lets Prometheus in Docker on Linux reach it.
  host = "127.0.0.1"
  host = ${?HOST}
  port = 8080
  port = ${?PORT}
  # "jetty" or "pekko" (STACK=pekko): the server, the registry's HTTP client and where streams run.
  stack = "jetty"
  stack = ${?STACK}
  # "kotlinx" or "jackson" (CODEC=jackson): what reads and writes the bodies served and the registry's.
  codec = "kotlinx"
  codec = ${?CODEC}
  arrivalsEvery = 5s
  outboxEvery = 1s

  # The demo's Postgres is on 55432 to avoid a local Postgres on 5432.
  database {
    url = "jdbc:postgresql://127.0.0.1:55432/petshop"
    url = ${?DATABASE_URL}
    user = "petshop"
    user = ${?DATABASE_USER}
    password = "petshop"
    password = ${?DATABASE_PASSWORD}
  }

  # "in-process" or "kafka" (BUS=kafka). The kafka section is read only when kafka is chosen.
  bus {
    kind = "in-process"
    kind = ${?BUS}
    kafka {
      bootstrap = "127.0.0.1:9092"
      bootstrap = ${?KAFKA_BOOTSTRAP}
      topic = "petshop.events"
      group = "petshop-projection"
      registry = "http://127.0.0.1:8081"
      registry = ${?SCHEMA_REGISTRY_URL}
    }
  }

  # An external service; demo/docker-compose.yml runs a stand-in on 8089.
  registry {
    baseUrl = "http://127.0.0.1:8089"
    baseUrl = ${?REGISTRY_URL}
    timeout = 2s
  }
}

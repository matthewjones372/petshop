petshop {
  # Loopback, so a laptop running the demo does not serve the shop to its network. HOST=0.0.0.0 is
  # what lets Prometheus in Docker on Linux reach it: see demo/README.md.
  host = "127.0.0.1"
  host = ${?HOST}
  port = 8080
  port = ${?PORT}
  arrivalsEvery = 5s
  outboxEvery = 1s

  # Where the outbox table lives. demo/docker-compose.yml runs a Postgres on 5432 with these.
  database {
    url = "jdbc:postgresql://127.0.0.1:5432/petshop"
    url = ${?DATABASE_URL}
    user = "petshop"
    user = ${?DATABASE_USER}
    password = "petshop"
    password = ${?DATABASE_PASSWORD}
  }

  # The chip registry: somebody else's service. demo/docker-compose.yml runs a stand-in on 8089.
  registry {
    baseUrl = "http://127.0.0.1:8089"
    baseUrl = ${?REGISTRY_URL}
    timeout = 2s
  }
}
